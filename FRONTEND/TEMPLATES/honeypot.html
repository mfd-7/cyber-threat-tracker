<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INFRACORP - Employee Portal</title>
    <style>
        :root { --bg: #0f1115; --fg: #ffffff; --accent: #333333; }
        body {
            background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .container {
            border: 1px solid var(--accent); padding: 40px 50px; width: 350px; background: #16181d;
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-text {
            font-size: 1.8rem; font-weight: 600; text-align: center; margin-bottom: 5px; letter-spacing: 1px;
        }
        .sub-text { font-size: 0.9rem; text-align: center; margin-bottom: 30px; color: #888; }
        label {
            display: block; font-size: 0.85rem; margin-bottom: 8px; color: #ccc;
        }
        input {
            width: 100%; padding: 12px; margin-bottom: 20px; background: #0f1115; border: 1px solid var(--accent);
            color: var(--fg); font-family: inherit; font-size: 1rem; box-sizing: border-box; border-radius: 4px;
        }
        input:focus { outline: none; border-color: #666; }
        button {
            width: 100%; padding: 12px; background: var(--fg); color: var(--bg); border: none; border-radius: 4px;
            font-family: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: #e0e0e0; }
        .error { color: #ff5555; background: rgba(255,85,85,0.1); border: 1px solid #ff5555; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 0.9rem; text-align: center;}
        .footer { margin-top: 30px; font-size: 0.75rem; color: #555; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-text">INFRACORP</div>
        <div class="sub-text">Authorized Personnel Only</div>
        {% if error %}
        <div class="error">Invalid credentials provided. Attempt logged.</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <label>Employee ID or Username</label>
            <input type="text" name="username" required autocomplete="off" spellcheck="false">
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <div class="footer">
        &copy; 2026 Infracorp Systems. All rights reserved.
    </div>
</body>
</html>
