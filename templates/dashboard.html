<!DOCTYPE html>
<html>
<head>
    <title>Cyber Threat Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 30px; margin: 0; }
        h1 { color: #ff4c4c; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .chart-container { width: 70%; margin: 30px auto; background-color: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background-color: #1e1e1e; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        th, td { border: 1px solid #333; padding: 12px; text-align: center; }
        th { background-color: #ff4c4c; color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: #2a2a2a; }
    </style>
</head>
<body>
    <h1>🛡️ Cyber Threat Tracker - Live Dashboard</h1>
    
    <div class="chart-container">
        <canvas id="attackChart"></canvas>
    </div>

    <h3>🔴 Recent Attack Logs</h3>
    <table>
        <tr>
            <th>Log ID</th>
            <th>Attacker IP</th>
            <th>Used Username</th>
            <th>Used Password</th>
            <th>Time of Attack</th>
        </tr>
        {% for log in logs %}
        <tr>
            <td>{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
            <td>{{ log[4] }}</td>
        </tr>
        {% endfor %}
    </table>

    <script>
        const labels = {{ ips | tojson }};
        const counts = {{ counts | tojson }};
        
        const ctx = document.getElementById('attackChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Number of Attacks per IP',
                    data: counts,
                    backgroundColor: 'rgba(255, 76, 76, 0.6)',
                    borderColor: 'rgba(255, 76, 76, 1)',
                    borderWidth: 1
                }]
            },
            options: { 
                scales: { 
                    y: { beginAtZero: true, ticks: { color: 'white' } },
                    x: { ticks: { color: 'white' } }
                },
                plugins: { legend: { labels: { color: 'white' } } }
            }
        });
    </script>
</body>
</html>
